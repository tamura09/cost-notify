name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_ACCOUNT_ID: "222165754930"
  AWS_ROLE_TO_ASSUME: "arn:aws:iam::222165754930:role/github-actions-lambda-artifacts"

jobs:
  test:
    name: Test (${{ matrix.function }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function:
          - aws-monthly-billing
          - aws-weekly-billing
          - hetzner-billing
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.function }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.function }}/go.mod
          cache-dependency-path: ${{ matrix.function }}/go.sum

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

  deploy:
    name: Deploy (${{ matrix.function }})
    needs: test
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function:
          - aws-monthly-billing
          - aws-weekly-billing
          - hetzner-billing
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.function }}/go.mod
          cache-dependency-path: ${{ matrix.function }}/go.sum

      - name: Build bootstrap binary
        working-directory: ${{ matrix.function }}
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -tags lambda.norpc -ldflags="-s -w" -o bootstrap .

      - name: Package artifact
        working-directory: ${{ matrix.function }}
        run: |
          touch -t 202001010000.00 bootstrap
          zip -X -q "${{ matrix.function }}.zip" bootstrap

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Upload artifact to S3
        working-directory: ${{ matrix.function }}
        run: |
          aws s3 cp "${{ matrix.function }}.zip" \
            "s3://aws-terraform-lambda-artifacts-${AWS_ACCOUNT_ID}-us-east-1/lambda/${{ matrix.function }}.zip"

      - name: Deploy Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "${{ matrix.function }}" \
            --s3-bucket "aws-terraform-lambda-artifacts-${AWS_ACCOUNT_ID}-us-east-1" \
            --s3-key "lambda/${{ matrix.function }}.zip" \
            --no-cli-pager
          aws lambda wait function-updated --function-name "${{ matrix.function }}"
