name: Build

on:
  push:
    branches:
      - main
    # Nothing in these ships in the artifact, so merging a change to them only
    # would redeploy identical code. pull_request keeps no such filter: the
    # required Test check has to report on every PR, or a docs-only PR could
    # never merge.
    paths-ignore:
      - "**.md"
      - renovate.json
      - .github/workflows/pr-review.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_ACCOUNT_ID: "222165754930"
  AWS_ROLE_TO_ASSUME: "arn:aws:iam::222165754930:role/github-actions-lambda-artifacts"

jobs:
  test:
    name: Test (${{ matrix.function }})
    # Pull requests only. A change reaches main through a PR that has already
    # run these checks, so repeating them after the merge would bill the same
    # minutes twice.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function:
          - aws-monthly-billing
          - aws-weekly-billing
          - hetzner-billing
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.function }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.function }}/go.mod
          cache-dependency-path: ${{ matrix.function }}/go.sum

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

  deploy:
    name: Deploy (${{ matrix.function }})
    # No needs: test. Test is skipped outside pull requests, and a skipped
    # dependency would skip this job too. workflow_dispatch on main redeploys
    # without a code change.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function:
          - aws-monthly-billing
          - aws-weekly-billing
          - hetzner-billing
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.function }}/go.mod
          cache-dependency-path: ${{ matrix.function }}/go.sum

      - name: Build bootstrap binary
        working-directory: ${{ matrix.function }}
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -tags lambda.norpc -ldflags="-s -w" -o bootstrap .

      - name: Package artifact
        working-directory: ${{ matrix.function }}
        run: |
          touch -t 202001010000.00 bootstrap
          zip -X -q "${{ matrix.function }}.zip" bootstrap

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Upload artifact to S3
        working-directory: ${{ matrix.function }}
        run: |
          aws s3 cp "${{ matrix.function }}.zip" \
            "s3://aws-terraform-lambda-artifacts-${AWS_ACCOUNT_ID}-us-east-1/lambda/${{ matrix.function }}.zip"

      - name: Deploy Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "${{ matrix.function }}" \
            --s3-bucket "aws-terraform-lambda-artifacts-${AWS_ACCOUNT_ID}-us-east-1" \
            --s3-key "lambda/${{ matrix.function }}.zip" \
            --query CodeSha256 --output text --no-cli-pager
          aws lambda wait function-updated --function-name "${{ matrix.function }}"
